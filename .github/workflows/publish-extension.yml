name: Publish Extension and Release

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Package and test without publishing to marketplaces'
        type: boolean
        default: false

concurrency:
  group: publish-extension-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Test, Package & Release Extension
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate AsyncAPI spec
        run: npm run asyncapi:validate

      - name: Check types
        run: npm run check-types

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Run Webview Tests
        run: npm run test:webview

      - name: Run Server Tests
        run: npm run test:server

      - name: Run Package Contract Tests
        run: npm run test:package-contract

      - name: Package VSIX
        id: package-vsix
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          VSIX_NAME="${NAME}-${VERSION}.vsix"
          npx @vscode/vsce package --no-dependencies -o "$VSIX_NAME"
          echo "vsixPath=$(pwd)/$VSIX_NAME" >> "$GITHUB_OUTPUT"
          echo "vsixName=$VSIX_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Verify VSIX Package and Extension Host
        shell: bash
        env:
          VSIX_PATH: ${{ steps.package-vsix.outputs.vsixPath }}
        run: xvfb-run -a node scripts/verify-vsix-package.mjs "$VSIX_PATH"

      - name: Upload VSIX to Release
        if: (github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && inputs.dry_run != true
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.package-vsix.outputs.tag }}
          name: v${{ steps.package-vsix.outputs.version }}
          files: ${{ steps.package-vsix.outputs.vsixPath }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload VSIX as Workflow Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package-vsix.outputs.vsixName }}
          path: ${{ steps.package-vsix.outputs.vsixPath }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish Verified VSIX to VS Code Marketplace
        if: env.VSCE_PAT != '' && inputs.dry_run != true
        uses: HaaLeo/publish-vscode-extension@v2
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        with:
          pat: ${{ secrets.VSCE_PAT }}
          registryUrl: https://marketplace.visualstudio.com
          extensionFile: ${{ steps.package-vsix.outputs.vsixPath }}
          skipDuplicate: true

      - name: Publish Verified VSIX to Open VSX
        if: env.OPEN_VSX_TOKEN != '' && inputs.dry_run != true
        uses: HaaLeo/publish-vscode-extension@v2
        env:
          OPEN_VSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN }}
        with:
          pat: ${{ secrets.OPEN_VSX_TOKEN }}
          registryUrl: https://open-vsx.org
          extensionFile: ${{ steps.package-vsix.outputs.vsixPath }}
          skipDuplicate: true

  publish-npm:
    name: Verify and Publish npm Package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node for Trusted Publishing
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install Trusted-Publishing npm CLI
        run: npm install --global "npm@^11.5.1"

      - name: Install Dependencies
        run: npm ci

      - name: Verify Trusted-Publishing Toolchain
        run: |
          node -e "const semver = require('semver'); const npm = require('child_process').execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim(); if (!semver.satisfies(process.version, '>=22.14.0') || !semver.satisfies(npm, '>=11.5.1')) { throw new Error('Trusted publishing requires Node >=22.14.0 and npm >=11.5.1'); } console.log('Node', process.version, 'npm', npm);"

      - name: Run Unit Tests
        run: npm test

      - name: Build and Verify npm Artifact
        id: npm-package
        shell: bash
        run: |
          output_dir="$RUNNER_TEMP/npm-package"
          npm run verify:npm-package -- --output-dir "$output_dir"
          echo "metadata=$output_dir/package-metadata.json" >> "$GITHUB_OUTPUT"

      - name: Upload Verified npm Artifact
        uses: actions/upload-artifact@v7
        with:
          name: npm-package-${{ github.run_attempt }}
          path: ${{ runner.temp }}/npm-package/
          if-no-files-found: error
          retention-days: 7

      - name: Publish Verified Artifact to npm
        if: ((github.event_name == 'release' && github.event.action == 'published') || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && inputs.dry_run != true
        continue-on-error: true
        run: >-
          node scripts/publish-npm-package.mjs
          --metadata "${{ steps.npm-package.outputs.metadata }}"
          --tag "${{ github.event.release.tag_name || github.ref_name }}"
          --ref "${{ github.ref }}"
